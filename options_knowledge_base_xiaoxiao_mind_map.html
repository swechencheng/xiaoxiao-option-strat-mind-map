# Xiaoxiao Options Knowledge Base (Exhaustive 354-Case Synthesis to 09/18)
## 0. Trading Philosophy & Core Prohibitions
### 3 Core Rules
- Trade strictly defined-risk strategies (BWB / Iron Condor / Vertical Spreads); abhor uncapped risk (naked single legs, wide strangles, put ratios)
- Trade Delta-0 structures (or adjust via Delta-0 rolls); never guess short-term tops/bottoms; harvest edge from Theta, Skew & non-Delta Greeks
- Make fewer errors rather than chasing max returns; follow "don't worry where it came from, worry where it's going" & Buffett's "Overnight Cash" Rule (+EV forward view)
### Core Principles
- Structurally bearish on Nasdaq (-20%, targeting QQQ 600; with 5% annual risk-free rates, 4 years of flat Nasdaq = 20% real decline)
- [09/11 True Context]: Stated "perma-bull" when discussing US Treasury Bonds (PE/PD & corporate debt at 11% yield nearing default -> hot money rotating back to risk-free 5% Treasuries); remained net short Nasdaq via ITM call spreads + dip-buying puts
- Essence of options: monetize non-Delta Greeks (Theta, Vega, Gamma, Charm, Vanna)
- Target profit profile: 30-50% from Delta, 50-70% from non-Delta Greeks
- Option credits are balance-sheet liabilities; "Melting Ice Cream Truck" analogy (sellers lock in buyers' missed opportunity cost)
- Theta is never free lunch (positive theta mandates negative gamma)
- Practical Delta-0 tolerance: on IBKR NQ order screen (already x20 multiplier), first two digits reading 0.0 (e.g. 0.037, -0.076, +0.080) is compliant; shift one strike if drifting near 0.10
### Core Prohibitions (Exhaustive)
- Never sell naked single-leg puts or calls (critiques classic Wheel Strategy: unable to sell calls at original cost basis after crash assignment)
- Never sell wide strangles; selling naked in low IV = picking up nickels in front of steamrollers
- Never trade Put Ratio Spreads (1:2, catastrophic uncapped downside)
- Never sell OTM index calls (underpriced due to put skew, negative EV); sell ATM calls only
- Avoid wide-gap diagonals; max allowable gap in high IV is 1-2 days (e.g. 0DTE/1DTE staggered IC or BWB diagonal)
- Never trade reverse diagonals (buying near-term, selling longer-dated)
- Never trade LEAPS calls or PMCC (unpredictable back-month extrinsic + ~10% immediate entry slippage loss)
- Never be a net seller in Low IV + Long DTE (double blow from crash + IV surge)
- Never trade deep ITM options (delta > 0.70; illiquid, wide spreads)
- Never trade Micro E-mini Nasdaq (MNQ) options (10x transaction drag vs NQ)
- Never trade options expiring beyond 90 days
- Avoid retail PFOF brokers (Futu, Robinhood); never use a Cash Account (even 1:1 vertical spreads require a Margin Account)
- Never rely on AI answers or generic calculators without live CME/IBKR data
- Never use mechanical stop-losses or 80% profit targets (surrenders final 20% free decay)
- Never concentrate risk in a single expiration date
- Beginners: avoid opening disconnected secondary positions (widen existing spreads or overlap legs to save fees)
- Bullish / Long-Stock accounts must NEVER dip-buy with put spreads during a crash (accelerates liquidation without negative-delta hedge)
- Never pay $4 to close a deep OTM short put early just to "free up your own margin"
## 1. Market Regimes & Strategy Calibration
### Core Metrics
- sd (single-day expected move): ATM straddle price (ATM call + put); Overnight sd (to 9:30 AM open, ~100 pts) vs Full-day sd (to 4:00 PM close)
- VXN: 30-day Nasdaq IV (check daily straddle sd for single-day move)
- IVR: <20 buying 1-3 month calls is marginally viable
- Standard deviation vocabulary: 3sd / 7sd moves (frequent in thin night/holiday sessions due to dealer DDH)
### Regime-to-Strategy Mapping
- Severe crash / panic + High VXN: Bearish BWB (0DTE/1DTE or 1-3 weeks) Delta 0; or two-step Legging-In (open upper ATM call spread at close, sell wide deep OTM put spread into night crash + IV spike)
- High VXN / Whipsaw regime (frequent 3sd swings): extend to 1-3 weeks (8-20 DTE) with 0.5/0.4/0.15/0.05 Bearish BWB or Iron Condor (+$70 to +$178/day Theta on NQ)
- Low VXN / Very low single-day sd: highest latent risk; 0DTE BWB not recommended (short strikes too close); sit out, trade 0DTE IC if watching screen, or use 1-3 week BWB
- Range-bound / consolidation: Neutral Iron Condor (Delta 0)
- Post-crash aftermath (forced short-term bullish): 1-2 week Iron Condor (0.5/0.35 + 0.25/0.10) or sell deep OTM put spreads
- Post-parabolic rally: retain bearish bias, Bearish BWB or Bearish Iron Condor
- Expiration week / Quadruple Witching / futures roll: volatility priced into sd; defined-risk only, typically next Friday expiry
- Pre-earnings / earnings day: 50/50 gamble, do not guess direction
- JPY / US Treasuries: sell naked puts when bullish (1 month DTE, delta 0.3-0.5)
## 2. Core Strategy Leg Formations
### Bearish Broken Wing Butterfly (BWB - Signature Setup)
- Structure 1 (3-Strike 1:2:1, early June 0DTE): Buy 1 ATM Put (0.50) + Sell 2 OTM Puts (0.30) + Buy 1 Deep OTM Put (0.10)
- Structure 2 (4-Strike Split 1:1:1:1, standard benchmark 0.50/0.40/0.15/0.05): Buy upper 0.50/0.40 Put Spread + Sell lower 0.15/0.05 Put Spread
- Wing-Width Ratio Rule: Net Delta 0, and lower sold spread width MUST be >= 2x upper bought spread width (e.g. 200-300 pts upper vs 600-1000 pts lower)
- Why Debit entry & barely loses on rallies: wide lower put spread is richly priced via index put skew, offsetting upper spread decay on rallies; conversely Bullish Call BWB fails on indices because upper OTM calls are too cheap
- Expirations: 0DTE/1DTE when VXN/sd is high; 1-3 weeks (8-28 DTE, +$50 to +$178/day Theta, hold >= 3 days) in whipsaw regimes; avoid 45-DTE
- 0DTE P&L profile (0.92 debit): -9 pt drop -> 5.49 (~6x); flat -> 1.99 (~2x); +5 pt rally -> 0.48 (-50%)
- Max loss = wing width difference (200 vs 800 gap = $12k max loss in circuit breaker); early stop near lowest strike on 0DTE salvages $2-3 extrinsic
### Iron Condor (IC)
- Structure: Sell Call Spread (0.50/0.40) + Sell Put Spread (0.15/0.05), credit entry, Net Delta 0
- Expirations: 1-3 weeks in high IV; 0DTE/1DTE Iron Condor viable in low IV or when actively watching screen
- Wing-Width Ratio: lower put spread width must be >= 2x upper call spread width
- Variants: Neutral (0.5/0.3+0.3/0.1); Bearish (0.5/0.4+0.15/0.05); 1-2 weeks (0.5/0.35+0.25/0.10); Positive-Delta (0.5/0.4+0.3/0.1)
- Clarification on "-0.20 Delta IC": never enter a new trade at -0.20 delta to bet on direction (= shorting 170 shares QQQ naked); seen only in two-step legging-in or legacy deep ITM call spreads paired with short puts
- Put-Call Parity equivalent to 4-strike BWB: named differently only to avoid illiquid ITM calls (0.60/0.50) by buying ATM puts (0.50/0.40)
- IC vs BWB: IC earns more in flat chop (diverges after 3 hours on 0DTE), but in crashes lower put losses can far exceed capped upper call gains
### Deep OTM Put Credit Spread (Dip-Buying Engine)
- Structure: Sell 1 Delta 0.15 (or 0.13/0.10) Put + Buy 1 Delta 0.05 (or 0.09/0.05) Put
- Net Delta: +0.04 to +0.05 per tranche; 1-5 days DTE (Xiaoxiao prefers 1-3 days; novices 5 days/Friday; 1-2 weeks or matching upper expiry when VXN spikes)
- Thesis: post-crash IV surge + put skew inflates OTM puts; profits even in slow downward drift, and can be rescued via butterfly if breached
- Scale in every 100-200 pt NQ drop across distinct expiration dates; never use to take share assignment
### Covered Call / Cash-Secured Put & 4% Implied Interest
- With cash: Buy 100 shares + Sell 1-month ATM call; Without cash: Sell 1-2 month ATM naked put
- 4% Implied Loan Interest: non-cash bullish options (e.g. buying calls) implicitly pay ~4% annual interest; buying 100 shares + selling ATM call (or selling put) collects that 4% interest
- Hedging leveraged ETFs (e.g. TQQQ): reduce share size directly rather than buying mismatched single-leg puts
### Classic Butterfly, Put Ratio & Naked Puts
- Classic Butterfly: equal wings mandate negative delta + negative theta; used strictly to rescue breached short puts
- Put Ratio (1:2): uncapped downside; 7sd crash loses $25 vs $4-5 on BWB
- Naked Puts (ZB / JPY): ~1 month DTE, 0.30-0.50 delta; lesson: JPY 0.0063 naked put suffered 3% (7sd) surge 1 day before expiry, wiping delta to 0 and missing the rally
### Diagonals & Trapped LEAPS Spread Rescue
- High-IV 1-day diagonal exception: sell 0DTE short legs + buy 1DTE long legs
- Rescuing a trapped illiquid LEAPS spread (SNDK 2027 case): do not close immediately for another 10% slippage loss; sell a 3-month OTM Call Spread (-0.05 delta) to neutralize total Delta to 0, or hold 1 year until liquidity improves
## 3. Expiration Selection Logic
- 0DTE Profit Window & Asian Auto-Close: close 0DTE combos at 1:00-3:00 PM ET (50%-75% max profit); set 2:10 PM ET auto-close order if sleeping in Asian timezone
- 1-3 Weeks: primary choice for 0.5/0.4/0.15/0.05 BWB or IC during high VXN or frequent 3sd whipsaw regimes
- Low IV Rally Nuance: never extend DTE to SELL extrinsic in low IV, but low IV is ideal for BUYING longer-dated extrinsic (e.g. extending 4-7 days when buying a 0.5/0.4 ATM Put Spread to rescue a breached Call Spread)
- Quarterly Futures Roll & Contango (+200-300 pts): expiring AM options cash-settle at 9:30 AM (margin freed immediately); next-quarter NQ futures trade 200-300 pts higher due to 4% annual (1% quarterly) interest carry—a structural tailwind for shorts

## 5. Position Monitoring
- Aggregate portfolio delta: general traders watch beyond ±0.3, high alert beyond ±0.5 (Xiaoxiao held -0.30 to -0.83 delta core short call spreads, giving him the hedge to dip-buy crashes; novices must not copy his large short base)
- Rising 0DTE sd into expiry (100 -> 115 -> 135 with 4h left): signals severe dealer DDH stress
- Leg delta triggers: upper short call drops to 0.35 (OTM) / BWB upper long put drops to 0.35 / IC upper long call reaches 0.65 / lower short put reaches 0.50-0.65
## 6. Adjustments & Defense (Critical Core)
### Core Principles
- 3 directions: expire worthless, scale in, or roll out ("if you never leave the gambling table, the money is never yours")
- Adjustments carry negative EV (~$20 friction); adjust only to avert max loss or eliminate negative-EV OTM short calls
### Triggers & Pre-Expiry (~3 Days Left) Review Rules
- Upper short call drops 150-200 pts OTM (or delta 0.40 prepare / 0.35 standard / 0.30 mandatory) -> roll down & out; waiting until 650-800 pts OTM causes "Double-Sided Losses" (under-earning on drop, losing big on bounce)
- Spot breaches first short strike by >100 pts -> evaluate; >300 pts -> roll immediately
- Pre-Expiry (~3 Days Left) Rules: ① Roll OTM short calls (delta <= 0.35/0.25) early because index put skew makes holding OTM short calls negative EV (10x explosion on bounce); ② Holding near-ATM into 9:30 AM cash settlement ("running the horse") is mathematically fair (Xiaoxiao rolled early on Tuesday to free up negative delta for Wednesday dip-buying); ③ 1-3 week BWB 3-step check (is spot between short strikes? does delta match today's view? roll upper long put spread if keeping short stance); ④ Unbreached OTM put credit spreads are held to expiry to decay to zero
### Downside Defense: Rolling Upper Spreads
- Close old upper spread (call spread or BWB upper put spread) -> sell next week's (or far-month) ATM call spread at 4-leg Delta 0 (or +0.03 to +0.05 delta if dip-buying)
- Rolling BWB upper put spread into next week's put spread: same strikes = +0.026 to +0.05 delta; strict Delta 0 requires widening new spread
- Consolidate two separate OTM upper spreads into one far-month ATM call spread via a 6-leg Delta-0 order to save fees
### Severe Downside: Rescuing Breached Puts & Second-Breach Leg Cancellation
- Trigger: spot touches/breaches short put (delta 0.50-0.65); execute during an intraday bounce to save intrinsic cost
- Buy Butterfly or BWB to roll down (6 contracts / 5 legs in IBKR): buy back breached short put + sell 2 lower puts (0.25-0.35 delta) + buy 1 lowest put + sell next-week deep OTM put spread to balance negative delta -> Net Delta 0
- Wing Width Principle: symmetric butterfly or BWB (wings within reasonable range, ~200-400 pts); equal-width wings are preferred because payoff below the lowest wing at expiry is 0, adding ZERO extra max downside risk beyond the original spread
- [Core] Reusing Old Long Puts & Second-Breach Automatic Leg Cancellation: on a narrow spread's first breach, existing long put (at 0.30-0.35 delta) serves directly as one of the butterfly legs; on a second breach, the 2 newly sold center puts land directly on your existing 2 long put strikes (28500P/28400P), automatically closing out the old legs without accumulating 10 legs!
- 3-Stage 0DTE Put Rescue: ① Split 0.60 delta or buy butterfly with ATM Long Call upper wing; ② Wait 2-3 hours for short put decay, then if stalled near 0DTE ATM Call, roll Call up 100 pts + buy Monday ATM Call Spread at Delta 0; ③ After 0DTE expires, split Monday spread into Friday 0.15/0.05 put spread + far-month 0.25/0.15 put spread (0.15/0.05 on far-month is too wide and risky); stop out at 4:55 PM if still ITM
- Extreme Multi-Day Crash Alternative (Caution): buy upper 0DTE/short OTM Call Spread (+0.20 delta) for violent rebound; convert to IC via 4-leg Delta-0 order once bounced to ATM
### Upside Defense: Managing Rallies & DTE Correction
- Rescuing BWB Upper Long Put at 0.35 Delta: ① Buy a higher-strike same-expiry 4-leg BWB using your existing 0.35 Long Put as one of the new Short Put legs to cancel it out; or ② Roll upper put spread out 1 week
- Rescuing Deep ITM Short Call Spread (Long Call reaches 0.65 delta): close ITM call spread -> buy ATM put spread (0.50/0.40) or sell new ITM call spread (0.60/0.50) at Delta 0; because low IV favors BUYING longer-dated extrinsic, extending DTE by 4-7 days (into next week) is advantageous!
- Trimming negative delta after rally: roll untested lower put spread up in same expiry with +0.04 to +0.05 delta
- [Spread Advantage 09/18]: monetize residual extrinsic on deep ITM long leg to finance higher ATM put spread, resetting breakeven to new short strike
### Dip-Buying with Positive Delta
- [Rule #1] Only accounts with a strong negative-delta short base are qualified to dip-buy crashes; long-stock accounts dip-buying with put spreads accelerate liquidation!
- Method 1 (Recommended when upper spread is OTM / for novices): tilt the 4-leg upper spread roll to +0.03 to +0.07 positive delta (adds zero new downside breach risk)
- Method 2 (Xiaoxiao's daily favorite): sell standalone 1-5 day (often 1-3 day) deep OTM put credit spread (+0.04 to +0.05 delta)
- Why separate 4-leg roll + 2-leg put spread instead of 6-leg order: directional combos require a price dip to fill, whereas Delta-0 combos only require liquidity
- Stagger every 100-200 pt drop across distinct expirations; cap general account positive delta <= 0.20-0.30
### ZB (30Y Treasury) Breached Naked Put Defense
- 1-to-2 Staggered 3-Leg Delta-0 Roll: buy back 1 old put (108p) + sell 2 lower puts (107p, 1 near-term + 1 out 2-4 weeks); take delivery at 107 and sell ATM Strangle
## 7. Order Execution Details
- Delta-0 execution: post at bid -> modify to mid - $0.25 (or mid - $0.50) -> step up +$0.25 every 2-5 seconds; shift strike if delta not 0.0xx
- Never leave a high-credit limit order resting for a fill (Adverse Selection): filling later means spot moved sharply and combo is no longer Delta 0 at fill!
- Reuse & cancel existing legs via Put-Call Parity to save 2 legs of fees and slippage
## 8. Greeks, Pricing & Microstructure
- Path-Independence (Immediacy): 0DTE BWB dropping 1sd in 1 minute shows immediate unrealized loss from negative Gamma before Theta decays over the day
- Vega irrelevance vs Vanna Short-Covering Squeeze (post-event IV crush collapses put delta, forcing dealers to buy back short futures and sparking vertical rallies)
- Symmetric straddling vertical spreads (0.60/0.40) have 0 Gamma and 0 Theta at entry center
- Calculus of IBKR P&L Graphs: Graph 1 is V(S), Delta is dV/dS, Gamma is d²V/dS²—only Graph 1 matters (set 2-4 days ahead)
- Quadruple Witching 8:00-9:30 AM "杀期权 (Max Pain Pinning)" toward peak Call OI; debunking crypto perpetual 3% stock arbitrage (stale Last price + wide bid-ask)
## 9. Accounting & Bookkeeping
- Two separate ledgers: Net Cashflow vs Realized/Unrealized P&L
- Downward rolls & expiring puts realize profits; ITM call spread unrealized losses accumulate until rolled up into ATM long put spread
